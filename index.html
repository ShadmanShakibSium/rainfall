<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rainfall — Mix your own rain sounds</title>

  <!-- ===== author & SEO ===== -->
  <meta name="description" content="Rainfall is a calming sound mixer. Blend rain, thunder, birds, wind, ocean waves and more, set a sleep timer, and let the evening settle.">
  <meta name="author" content="Md. Shadman Shakib Sium">
  <meta name="keywords" content="rain sounds, sleep sounds, white noise, ambient mixer, sleep timer, relax, focus">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://rainfallsound.netlify.app/">

  <!-- ===== Favicon & icons ===== -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- ===== PWA ===== -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a1f29">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rainfall">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="Rainfall">

  <!-- ===== Social sharing (Open Graph / Twitter) ===== -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Rainfall">
  <meta property="og:title" content="Rainfall — Mix your own rain sounds">
  <meta property="og:description" content="Blend rain, thunder, birds and more. Set a sleep timer and let the evening settle.">
  <meta property="og:url" content="https://rainfallsound.netlify.app/">
  <meta property="og:image" content="https://rainfallsound.netlify.app/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Rainfall — Mix your own rain sounds">
  <meta name="twitter:description" content="Blend rain, thunder, birds and more. Set a sleep timer and let the evening settle.">
  <meta name="twitter:image" content="https://rainfallsound.netlify.app/icons/icon-512.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --ink: #dcebef;
      --mute: #7f9aa3;
      --line: rgba(190, 230, 240, .14);
      --acc: #a5e8f2
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      font-family: Figtree, system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: radial-gradient(70% 45% at 50% 108%, rgba(60, 150, 172, .22), transparent 70%), linear-gradient(180deg, #050e14 0%, #0a1f29 58%, #0c2833 100%) fixed
    }

    button {
      font-family: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 3px
    }

    #pond {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none
    }

    .wrap {
      position: relative;
      max-width: 1040px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 8vh 28px;
      display: grid;
      grid-template-columns: minmax(280px, 5fr) minmax(320px, 6fr);
      gap: 7vw;
      align-items: center
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.8rem, 11vw, 6.8rem);
      line-height: .9;
      letter-spacing: -.025em
    }

    .lede {
      margin-top: 16px;
      color: var(--mute);
      font-size: 1.05rem;
      max-width: 24ch;
      line-height: 1.45
    }

    .ctl {
      margin-top: 38px;
      display: flex;
      align-items: center;
      gap: 22px
    }

    #play {
      position: relative;
      flex: none;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--acc);
      color: #06222a;
      font-size: 27px;
      transition: transform .15s
    }

    #play:active {
      transform: scale(.95)
    }

    #play .fa-play {
      margin-left: 5px
    }

    #play::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--acc);
      opacity: 0
    }

    #play.on::after {
      animation: ring 2.6s ease-out infinite
    }

    @keyframes ring {
      0% {
        transform: scale(1);
        opacity: .65
      }

      100% {
        transform: scale(1.8);
        opacity: 0
      }
    }

    .vol {
      flex: 1;
      min-width: 0;
      display: grid;
      gap: 8px;
      color: var(--mute);
      font-size: .85rem
    }

    .tm {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 18px;
      color: var(--mute);
      font-size: .92rem
    }

    .seg {
      display: flex;
      gap: 16px
    }

    .seg button {
      padding: 4px 0;
      color: var(--ink);
      opacity: .7;
      border-bottom: 1px solid transparent;
      font-size: .95rem
    }

    .seg button:hover {
      opacity: 1
    }

    .seg button.sel {
      opacity: 1;
      border-bottom-color: var(--acc)
    }

    .cu {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .cu input {
      width: 62px;
      padding: 5px 0;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font: inherit;
      font-size: .95rem
    }

    .cu input::placeholder {
      color: var(--mute)
    }

    .cu button {
      color: var(--acc);
      font-size: .92rem
    }

    .tclock {
      margin-top: 10px;
      min-height: 2.6rem;
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 2.4rem;
      line-height: 1.1;
      font-variant-numeric: tabular-nums
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: var(--mute);
      font-size: .85rem;
      padding-bottom: 12px
    }

    /* PWA install button (hidden until the browser says the app is installable) */
    #install {
      color: var(--acc);
      font-size: .85rem
    }

    #install i {
      margin-right: 6px
    }

    #install[hidden] {
      display: none
    }

    .list {
      border-top: 1px solid var(--line)
    }

    .row {
      display: grid;
      grid-template-columns: 26px 1fr 120px 24px;
      align-items: center;
      gap: 16px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line)
    }

    .ic {
      font-size: 1.1rem;
      color: var(--mute);
      text-align: center;
      transition: color .3s
    }

    .row.live .ic {
      color: var(--acc)
    }

    .nm {
      font-size: 1.06rem;
      font-weight: 500
    }

    .err {
      display: block;
      color: #f3a99b;
      font-size: .76rem;
      font-weight: 400;
      margin-top: 2px
    }

    .err:empty {
      display: none
    }

    .rm {
      color: var(--mute);
      font-size: .85rem;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transition: color .2s, background .2s
    }

    .rm:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, .08)
    }

    .addbtn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 17px 0;
      color: var(--acc);
      font-size: 1.02rem;
      border-bottom: 1px solid var(--line);
      text-align: left
    }

    .addbtn i {
      width: 26px;
      text-align: center;
      font-size: .95rem;
      transition: transform .25s
    }

    .addbtn[aria-expanded=true] i {
      transform: rotate(45deg)
    }

    .more[hidden],
    .addbtn[hidden] {
      display: none
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 13px 0 13px 0;
      border-bottom: 1px solid var(--line);
      font-size: 1rem;
      text-align: left;
      color: var(--ink);
      transition: background .2s
    }

    .opt:hover {
      background: rgba(255, 255, 255, .04)
    }

    .opt i {
      width: 26px;
      text-align: center;
      color: var(--mute)
    }

    .opt span {
      margin-left: auto;
      color: var(--acc);
      font-size: .88rem;
      padding-right: 2px
    }

    .foot {
      margin-top: 28px;
      color: var(--mute);
      font-size: .78rem
    }

    .foot a {
      color: inherit
    }

    input[type=range] {
      --p: 50%;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: transparent;
      cursor: pointer
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 2px;
      background: linear-gradient(90deg, var(--acc) var(--p), rgba(190, 230, 240, .2) var(--p))
    }

    input[type=range]::-moz-range-track {
      height: 2px;
      background: linear-gradient(90deg, var(--acc) var(--p), rgba(190, 230, 240, .2) var(--p))
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      margin-top: -5.5px;
      border-radius: 50%;
      background: var(--ink);
      border: 0
    }

    input[type=range]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 0;
      border-radius: 50%;
      background: var(--ink)
    }

    @media (max-width:820px) {
      .wrap {
        grid-template-columns: 1fr;
        gap: 40px;
        align-items: start;
        padding: 44px 20px 60px
      }

      #play {
        width: 74px;
        height: 74px;
        font-size: 23px
      }

      .row {
        grid-template-columns: 24px 1fr 96px 24px;
        gap: 12px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <canvas id="pond" aria-hidden="true"></canvas>
  <noscript style="position:relative;display:block;padding:24px;color:#dcebef">Rainfall needs JavaScript to play sounds.</noscript>

  <div class="wrap">
    <section>
      <h1>Rainfall</h1>
      <p class="lede">Mix your own sounds and let the evening settle.</p>

      <div class="ctl">
        <button id="play" aria-label="Play"><i class="fa-solid fa-play"></i></button>
        <label class="vol">Volume<input id="mv" type="range" min="0" max="1" step=".01"></label>
      </div>

      <div class="tm">
        <span>Sleep timer</span>
        <div class="seg" id="topts"></div>
        <div class="cu"><input id="cm" type="number" min="1" max="720" placeholder="min"
            aria-label="Custom minutes"><button id="cset">Set</button></div>
      </div>
      <div class="tclock" id="tclock" aria-live="off"></div>
    </section>

    <section>
      <div class="head"><span>Sounds</span><button id="install" hidden><i class="fa-solid fa-download"></i>Install app</button></div>
      <div class="list" id="list"></div>
      <button class="addbtn" id="addbtn" aria-expanded="false"><i class="fa-solid fa-plus"></i>Add a sound</button>
      <div class="more" id="more" hidden></div>
      <!-- EDIT ME: footer / credits -->
      <p class="foot">Made by <a href="https://aboutshadman.netlify.app/" rel="author noopener">Md. Shadman Shakib Sium</a></p>
    </section>
  </div>

  <script>

    const CATS = {
      rain: { name: 'Rain', icon: 'cloud-showers-heavy' },
      thunder: { name: 'Thunderstorm', icon: 'bolt' },
      birds: { name: 'Birds', icon: 'dove' },
      wind: { name: 'Wind', icon: 'wind' },
      waves: { name: 'Ocean waves', icon: 'water' },
      crickets: { name: 'Crickets', icon: 'bug' },
      // stream:   { name: 'Stream',         icon: 'droplet' },
      fire: { name: 'Crackling fire', icon: 'fire' },
    };
    const FIRST_VISIT = ['rain', 'thunder'];
    const EXT = ['mp3', 'wav', 'ogg', 'm4a'];
    const $ = id => document.getElementById(id);

    /* ---------- PWA: service worker + install button ---------- */
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
    }
    let installEvt = null;
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('install').hidden = false; });
    $('install').onclick = async () => {
      if (!installEvt) return;
      installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('install').hidden = true;
    };
    addEventListener('appinstalled', () => { $('install').hidden = true; });

    /* ---------- saved state (first visit = rain + thunder only) ---------- */
    let sel, vol = {}, master = .8, fade = 1, playing = false, fadeTimer;
    try {
      const s = JSON.parse(localStorage.getItem('rainsounds'));
      if (s && Array.isArray(s.sel)) { sel = s.sel.filter(k => CATS[k]); vol = s.vol || {}; master = s.master ?? .8; }
    } catch (e) { }
    if (!sel) sel = [...FIRST_VISIT];
    const save = () => { try { localStorage.setItem('rainsounds', JSON.stringify({ sel, vol, master })); } catch (e) { } };
    const vOf = k => vol[k] ?? .7;
    const fill = r => r.style.setProperty('--p', (r.value * 100) + '%');

    /* ---------- audio (a category is only touched once it is selected) ---------- */
    const runtime = {};
    const exists = u => new Promise(r => {
      const a = new Audio(); a.preload = 'metadata';
      a.onloadedmetadata = () => r(true); a.onerror = () => r(false);
      setTimeout(() => r(false), 4000); a.src = u;
    });
    async function scan(k) {
      const files = [];
      for (let n = 1; n <= 60; n++) {
        let hit = null;
        for (const e of EXT) { const u = `sounds/${k}/${n}.${e}`; if (await exists(u)) { hit = u; break; } }
        if (!hit) break;
        files.push(hit);
      }
      return files;
    }
    function ensure(k) {
      if (runtime[k]) return;
      const c = runtime[k] = { files: [], ready: false, active: false, cur: null, a: new Audio(), row: null };
      c.a.onended = () => { if (c.active) playRandom(k); };
      scan(k).then(f => { c.files = f; c.ready = true; paintInfo(k); sync(); });
    }
    const level = k => Math.min(1, Math.max(0, vOf(k) * master * fade));
    function playRandom(k) {
      const c = runtime[k]; if (!c.files.length) return;
      let f = c.files[Math.floor(Math.random() * c.files.length)];
      if (c.files.length > 1 && f === c.cur) { const r = c.files.filter(x => x !== c.cur); f = r[Math.floor(Math.random() * r.length)]; }
      c.cur = f; c.a.loop = c.files.length === 1; c.a.src = f; c.a.volume = level(k);
      c.a.play().catch(() => { });
    }
    function sync() {
      Object.keys(runtime).forEach(k => {
        const c = runtime[k], want = playing && sel.includes(k) && c.files.length > 0;
        c.a.volume = level(k);
        if (want && !c.active) { c.active = true; playRandom(k); }
        else if (!want && c.active) { c.active = false; c.a.pause(); }
        if (c.row) c.row.classList.toggle('live', want);
      });
    }
    function setPlay(p) {
      clearInterval(fadeTimer); fade = 1; playing = p;
      $('play').innerHTML = '<i class="fa-solid fa-' + (p ? 'pause' : 'play') + '"></i>';
      $('play').classList.toggle('on', p);
      $('play').setAttribute('aria-label', p ? 'Pause' : 'Play');
      sync();
    }
    $('play').onclick = () => setPlay(!playing);
    $('mv').value = master; fill($('mv'));
    $('mv').oninput = e => { master = +e.target.value; fill(e.target); save(); sync(); };

    /* ---------- sound list ---------- */
    function paintInfo(k) {
      const c = runtime[k]; if (!c || !c.row) return;
      c.row.querySelector('.err').textContent = (c.ready && !c.files.length) ? 'No files in sounds/' + k + '/' : '';
    }
    function render() {
      const l = $('list'); l.innerHTML = '';
      sel.forEach(k => {
        ensure(k);
        const C = CATS[k], row = document.createElement('div'); row.className = 'row';
        row.innerHTML = '<i class="fa-solid fa-' + C.icon + ' ic"></i><div class="nm">' + C.name + '<small class="err"></small></div>' +
          '<input type="range" min="0" max="1" step=".01" aria-label="' + C.name + ' volume">' +
          '<button class="rm" aria-label="Remove ' + C.name + '"><i class="fa-solid fa-xmark"></i></button>';
        const r = row.querySelector('input'); r.value = vOf(k); fill(r);
        r.oninput = () => { vol[k] = +r.value; fill(r); save(); sync(); };
        row.querySelector('.rm').onclick = () => { sel = sel.filter(x => x !== k); save(); render(); };
        runtime[k].row = row; paintInfo(k); l.appendChild(row);
      });
      const rest = Object.keys(CATS).filter(k => !sel.includes(k)), m = $('more'); m.innerHTML = '';
      rest.forEach(k => {
        const C = CATS[k], b = document.createElement('button'); b.className = 'opt';
        b.innerHTML = '<i class="fa-solid fa-' + C.icon + '"></i>' + C.name + '<span>Add</span>';
        b.onclick = () => { sel.push(k); save(); render(); };
        m.appendChild(b);
      });
      $('addbtn').hidden = !rest.length;
      if (!rest.length) m.hidden = true;
      sync();
    }
    $('addbtn').onclick = () => {
      const m = $('more'); m.hidden = !m.hidden; $('addbtn').setAttribute('aria-expanded', String(!m.hidden));
    };
    render();

    /* ---------- timer ---------- */
    let endAt = 0, tick;
    [15, 30, 60, 120].forEach(m => {
      const b = document.createElement('button'); b.textContent = m; b.dataset.m = m; b.setAttribute('aria-label', m + ' minutes');
      b.onclick = () => setTimer(+b.dataset.m); $('topts').appendChild(b);
    });
    const off = document.createElement('button'); off.textContent = 'Off'; off.dataset.m = 0; off.onclick = () => setTimer(0); $('topts').appendChild(off);
    function setTimer(m) {
      clearInterval(tick); endAt = 0; $('tclock').textContent = '';
      [...$('topts').children].forEach(b => b.classList.toggle('sel', +b.dataset.m === m && m > 0));
      if (!m) return;
      if (!playing) setPlay(true);
      endAt = Date.now() + m * 60000;
      const show = () => {
        const r = endAt - Date.now(); if (r <= 0) return false;
        const s = Math.ceil(r / 1000), h = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60, p = n => String(n).padStart(2, '0');
        $('tclock').textContent = (h ? h + ':' : '') + p(mm) + ':' + p(ss); return true;
      };
      show();
      tick = setInterval(() => { if (!show()) { clearInterval(tick); fadeOut(); } }, 500);
    }
    function fadeOut() {
      $('tclock').textContent = 'Fading out…';
      fadeTimer = setInterval(() => {
        fade = Math.max(0, fade - .05); sync();
        if (fade <= 0) { setPlay(false); setTimer(0); }
      }, 300);
    }
    $('cset').onclick = () => {
      const m = parseInt($('cm').value, 10);
      if (m > 0 && m <= 720) setTimer(m);
    };

    /* ---------- ripples on dark water: the rain you pick sets how hard it falls ---------- */
    (function () {
      const cv = $('pond'), g = cv.getContext('2d');
      const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
      let W, H, S, rip = [], acc = 0, last = performance.now();
      const rnd = (a, b) => a + Math.random() * (b - a);
      function size() { S = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * S; H = cv.height = innerHeight * S; }
      function spawn(t) {
        const y = H * rnd(.32, 1), depth = y / H;
        rip.push({ x: rnd(0, W), y, t0: t, dur: rnd(1700, 2900), max: (30 + 130 * depth) * S * rnd(.55, 1.1), a: .18 + .32 * depth });
      }
      function frame(t) {
        const dt = Math.min(.1, (t - last) / 1000); last = t;
        const rain = playing && sel.includes('rain');
        const rate = playing ? (rain ? 1.5 + 13 * vOf('rain') * master * fade : 1.2 * master * fade) : .22;
        acc += rate * dt; while (acc >= 1) { acc -= 1; spawn(t); }
        g.clearRect(0, 0, W, H); g.lineWidth = Math.max(1, S * .9);
        rip = rip.filter(r => t - r.t0 < r.dur);
        rip.forEach(r => {
          const age = (t - r.t0) / r.dur;
          if (age < .1) { g.fillStyle = `rgba(190,240,248,${.5 * (1 - age / .1)})`; g.beginPath(); g.ellipse(r.x, r.y, 2.2 * S, .9 * S, 0, 0, 7); g.fill(); }
          for (let i = 0; i < 3; i++) {
            const a2 = age - i * .1; if (a2 <= 0 || a2 >= 1) continue;
            const e = 1 - Math.pow(1 - a2, 2.2), rx = r.max * (1 - i * .27) * e;
            g.strokeStyle = `rgba(165,232,242,${r.a * Math.pow(1 - a2, 1.8) * (1 - i * .3)})`;
            g.beginPath(); g.ellipse(r.x, r.y, rx, rx * .34, 0, 0, 7); g.stroke();
          }
        });
        if (!still) requestAnimationFrame(frame);
      }
      addEventListener('resize', size); size();
      if (still) { for (let i = 0; i < 8; i++) { spawn(performance.now() - 600); } frame(performance.now()); }
      else requestAnimationFrame(frame);
    })();
  </script>
</body>

</html>
