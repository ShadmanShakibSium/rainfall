<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Instrument+Serif&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --ink: #dcebef;
      --mute: #7f9aa3;
      --line: rgba(190, 230, 240, .14);
      --acc: #a5e8f2
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html {
      background: #0a1f29
    }

    body {
      font-family: Figtree, system-ui, sans-serif;
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation
    }

    /* fixed gradient layer (much cheaper on phones than background-attachment: fixed) */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(70% 45% at 50% 108%, rgba(60, 150, 172, .22), transparent 70%), linear-gradient(180deg, #050e14 0%, #0a1f29 58%, #0c2833 100%);
      transform: translateZ(0)
    }

    button {
      font-family: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 3px
    }

    #pond {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      transform: translateZ(0)
    }

    .wrap {
      position: relative;
      width: 100%;
      flex: 1 0 auto;
      max-width: 1040px;
      margin: 0 auto;
      padding: 8vh 28px;
      display: grid;
      grid-template-columns: minmax(280px, 5fr) minmax(320px, 6fr);
      gap: 7vw;
      align-items: center
    }

    h1 {
      font-family: 'Instrument Serif', Georgia, serif;
      font-weight: 400;
      font-size: clamp(3.8rem, 11vw, 6.8rem);
      line-height: .9;
      letter-spacing: -.025em
    }

    .lede {
      margin-top: 16px;
      color: var(--mute);
      font-size: 1.05rem;
      max-width: 24ch;
      line-height: 1.45
    }

    .ctl {
      margin-top: 38px;
      display: flex;
      align-items: center;
      gap: 22px
    }

    #play {
      position: relative;
      flex: none;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--acc);
      color: #06222a;
      font-size: 27px;
      transition: transform .15s
    }

    #play:active {
      transform: scale(.95)
    }

    #play .fa-play {
      margin-left: 5px
    }

    #play::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid var(--acc);
      opacity: 0
    }

    #play.on::after {
      animation: ring 2.6s ease-out infinite
    }

    @keyframes ring {
      0% {
        transform: scale(1);
        opacity: .65
      }

      100% {
        transform: scale(1.8);
        opacity: 0
      }
    }

    .vol {
      flex: 1;
      min-width: 0;
      display: grid;
      gap: 8px;
      color: var(--mute);
      font-size: .85rem
    }

    .tm {
      margin-top: 30px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 18px;
      color: var(--mute);
      font-size: .92rem
    }

    .seg {
      display: flex;
      gap: 16px
    }

    .seg button {
      padding: 4px 0;
      color: var(--ink);
      opacity: .7;
      border-bottom: 1px solid transparent;
      font-size: .95rem
    }

    .seg button:hover {
      opacity: 1
    }

    .seg button.sel {
      opacity: 1;
      border-bottom-color: var(--acc)
    }

    .cu {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .cu input {
      width: 62px;
      padding: 5px 0;
      background: none;
      border: 0;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font: inherit;
      font-size: .95rem
    }

    .cu input::placeholder {
      color: var(--mute)
    }

    .cu button {
      color: var(--acc);
      font-size: .92rem
    }

    .tclock {
      margin-top: 10px;
      min-height: 2.6rem;
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 2.4rem;
      line-height: 1.1;
      font-variant-numeric: tabular-nums
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: var(--mute);
      font-size: .85rem;
      padding-bottom: 12px
    }

    /* PWA install button (hidden until the browser says the app is installable) */
    #install {
      color: var(--acc);
      font-size: .85rem
    }

    #install i {
      margin-right: 6px
    }

    #install[hidden] {
      display: none
    }

    .list {
      border-top: 1px solid var(--line)
    }

    .row {
      display: grid;
      grid-template-columns: 26px 1fr 120px 24px;
      align-items: center;
      gap: 16px;
      padding: 17px 0;
      border-bottom: 1px solid var(--line)
    }

    .ic {
      font-size: 1.1rem;
      color: var(--mute);
      text-align: center;
      transition: color .3s
    }

    .row.live .ic {
      color: var(--acc)
    }

    .nm {
      font-size: 1.06rem;
      font-weight: 500
    }

    .err {
      display: block;
      color: #f3a99b;
      font-size: .76rem;
      font-weight: 400;
      margin-top: 2px
    }

    .err:empty {
      display: none
    }

    .rm {
      color: var(--mute);
      font-size: .85rem;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transition: color .2s, background .2s
    }

    .rm:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, .08)
    }

    .addbtn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 17px 0;
      color: var(--acc);
      font-size: 1.02rem;
      border-bottom: 1px solid var(--line);
      text-align: left
    }

    .addbtn i {
      width: 26px;
      text-align: center;
      font-size: .95rem;
      transition: transform .25s
    }

    .addbtn[aria-expanded=true] i {
      transform: rotate(45deg)
    }

    .more[hidden],
    .addbtn[hidden] {
      display: none
    }

    .opt {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 13px 0 13px 0;
      border-bottom: 1px solid var(--line);
      font-size: 1rem;
      text-align: left;
      color: var(--ink);
      transition: background .2s
    }

    .opt:hover {
      background: rgba(255, 255, 255, .04)
    }

    .opt i {
      width: 26px;
      text-align: center;
      color: var(--mute)
    }

    .opt span {
      margin-left: auto;
      color: var(--acc);
      font-size: .88rem;
      padding-right: 2px
    }

    /* "Made by" — always the last thing on the page */
    .foot {
      position: relative;
      flex: none;
      text-align: center;
      padding: 18px 20px 22px;
      color: var(--mute);
      font-size: .8rem
    }

    .foot a {
      color: inherit
    }

    input[type=range] {
      --p: 50%;
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: transparent;
      cursor: pointer
    }

    input[type=range]::-webkit-slider-runnable-track {
      height: 2px;
      background: linear-gradient(90deg, var(--acc) var(--p), rgba(190, 230, 240, .2) var(--p))
    }

    input[type=range]::-moz-range-track {
      height: 2px;
      background: linear-gradient(90deg, var(--acc) var(--p), rgba(190, 230, 240, .2) var(--p))
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      margin-top: -5.5px;
      border-radius: 50%;
      background: var(--ink);
      border: 0
    }

    input[type=range]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: 0;
      border-radius: 50%;
      background: var(--ink)
    }

    @media (max-width:820px) {
      .wrap {
        grid-template-columns: 1fr;
        gap: 40px;
        align-items: start;
        padding: 44px 20px 40px
      }

      #play {
        width: 74px;
        height: 74px;
        font-size: 23px
      }

      .row {
        grid-template-columns: 24px 1fr 96px 24px;
        gap: 12px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <canvas id="pond" aria-hidden="true"></canvas>
  <noscript style="position:relative;display:block;padding:24px;color:#dcebef">Rainfall needs JavaScript to play sounds.</noscript>

  <div class="wrap">
    <section>
      <h1>Rainfall</h1>
      <p class="lede">Mix your own sounds and let the evening settle.</p>

      <div class="ctl">
        <button id="play" aria-label="Play"><i class="fa-solid fa-play"></i></button>
        <label class="vol">Volume<input id="mv" type="range" min="0" max="1" step=".01"></label>
      </div>

      <div class="tm">
        <span>Sleep timer</span>
        <div class="seg" id="topts"></div>
        <div class="cu"><input id="cm" type="number" min="1" max="720" placeholder="min"
            aria-label="Custom minutes"><button id="cset">Set</button></div>
      </div>
      <div class="tclock" id="tclock" aria-live="off"></div>
    </section>

    <section>
      <div class="head"><span>Sounds</span><button id="install" hidden><i class="fa-solid fa-download"></i>Install app</button></div>
      <div class="list" id="list"></div>
      <button class="addbtn" id="addbtn" aria-expanded="false"><i class="fa-solid fa-plus"></i>Add a sound</button>
      <div class="more" id="more" hidden></div>
    </section>
  </div>

  <footer class="foot">Made by <a href="https://aboutshadman.netlify.app/" rel="author noopener">Md. Shadman Shakib Sium</a></footer>

  <script>

    const CATS = {
      rain: { name: 'Rain', icon: 'cloud-showers-heavy' },
      thunder: { name: 'Thunderstorm', icon: 'bolt' },
      birds: { name: 'Birds', icon: 'dove' },
      wind: { name: 'Wind', icon: 'wind' },
      waves: { name: 'Ocean waves', icon: 'water' },
      crickets: { name: 'Crickets', icon: 'bug' },
      // stream:   { name: 'Stream',         icon: 'droplet' },
      fire: { name: 'Crackling fire', icon: 'fire' },
    };
    const FIRST_VISIT = ['rain', 'thunder'];
    const EXT = ['mp3', 'wav', 'ogg', 'm4a'];
    const XF = 5; 
    const RAMP = .025; 
    const $ = id => document.getElementById(id);

    /* ---------- PWA: service worker + install button ---------- */
    if ('serviceWorker' in navigator) {
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
    }
    let installEvt = null;
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('install').hidden = false; });
    $('install').onclick = async () => {
      if (!installEvt) return;
      installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('install').hidden = true;
    };
    addEventListener('appinstalled', () => { $('install').hidden = true; });

    /* ---------- saved state (first visit = rain + thunder only) ---------- */
    let sel, vol = {}, master = .8, fade = 1, playing = false, fadeTimer;
    try {
      const s = JSON.parse(localStorage.getItem('rainsounds'));
      if (s && Array.isArray(s.sel)) { sel = s.sel.filter(k => CATS[k]); vol = s.vol || {}; master = s.master ?? .8; }
    } catch (e) { }
    if (!sel) sel = [...FIRST_VISIT];
    let saveT;
    const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem('rainsounds', JSON.stringify({ sel, vol, master })); } catch (e) { } }, 300); };
    const vOf = k => vol[k] ?? .7;
    const fill = r => r.style.setProperty('--p', (r.value * 100) + '%');

    /* ---------- audio ---------- */
    const runtime = {}, pending = [];
    let loaded = false;
    const freeEl = e => { e.pause(); e.removeAttribute('src'); e.load(); };
    const level = k => Math.min(1, Math.max(0, vOf(k) * master * fade));
    const applyVol = k => { const c = runtime[k]; c.els.forEach((e, i) => { e.volume = Math.min(1, Math.max(0, level(k) * c.g[i])); }); };

    // cheap existence check (HEAD request, no audio data downloaded)
    async function resolve(k, n) {
      const c = runtime[k]; if (n in c.urls) return c.urls[n];
      let hit = false;
      for (const e of EXT) {
        const u = `sounds/${k}/${n}.${e}`;
        try {
          const r = await fetch(u, { method: 'HEAD' });
          if (r.ok && !/text\/html/i.test(r.headers.get('content-type') || '')) { hit = u; break; }
        } catch (_) { }
      }
      return c.urls[n] = hit;
    }
    function ensure(k) {
      if (runtime[k]) return;
      const c = runtime[k] = { els: [new Audio(), new Audio()], g: [0, 0], cur: -1, n: 0, count: 0, urls: {}, first: null, ready: false, active: false, xf: null, next: null, tok: 0, row: null };
      c.els.forEach((e, i) => {
        e.preload = 'auto';
        e.onended = () => { if (c.active && !c.xf && i === c.cur) advance(k); };
        e.onerror = () => {
          if (!e.getAttribute('src') || !c.active) return;
          if (c.xf && i === c.xf.to) c.xf.bad = true; else if (i === c.cur) advance(k);
        };
      });
      loaded ? prime(k) : pending.push(k);
    }
    function prime(k) {
      const c = runtime[k];
      resolve(k, 1).then(u => {
        c.first = u; c.ready = true;
        if (u && sel.includes(k) && c.cur < 0 && !c.els[0].getAttribute('src')) c.els[0].src = u;   // pre-buffer first file
        paintInfo(k); sync();
      });
    }
    const boot = () => { if (loaded) return; loaded = true; pending.splice(0).forEach(prime); };
    if (document.readyState === 'complete') boot();
    else addEventListener('load', () => (window.requestIdleCallback ? requestIdleCallback(boot, { timeout: 2500 }) : setTimeout(boot, 300)));

    async function planNext(k) {
      const c = runtime[k], tok = ++c.tok; let n, u;
      if (c.count === 1) { n = 1; u = c.urls[1]; }
      else if (c.count > 1) {
        do { n = 1 + Math.floor(Math.random() * c.count); } while (n === c.n);
        u = await resolve(k, n);
      } else {
        n = c.n + 1; u = await resolve(k, n);
        if (!u) { c.count = c.n; n = 1; u = c.urls[1] || await resolve(k, 1); }
      }
      if (tok === c.tok) c.next = u ? { n, url: u } : null;
    }
    function startFirst(k) {
      const c = runtime[k], e = c.els[0];
      if (!e.getAttribute('src')) e.src = c.first;
      c.n = 1; c.cur = 0; c.g = [1, 0]; c.xf = null; c.next = null;
      e.play().catch(() => { });
      planNext(k);
    }
    async function advance(k) {       // hard switch (only used if a track ends without a crossfade)
      const c = runtime[k];
      if (!c.next) await planNext(k);
      if (!c.next || !c.active) return;
      const from = c.cur, to = 1 - from, el = c.els[to];
      freeEl(c.els[from]); c.g[from] = 0;
      el.src = c.next.url; c.g[to] = 1; c.cur = to; c.n = c.next.n; c.next = null; c.xf = null;
      el.play().catch(() => { });
      applyVol(k); planNext(k);
    }
    function resetCat(k) {
      const c = runtime[k]; c.tok++; c.active = false;
      c.els.forEach(freeEl); c.cur = -1; c.n = 0; c.g = [0, 0]; c.xf = null; c.next = null;
    }
    function sync() {
      Object.keys(runtime).forEach(k => {
        const c = runtime[k], on = sel.includes(k), want = playing && on && c.ready && !!c.first;
        if (!on && (c.cur > -1 || c.els[0].getAttribute('src') || c.els[1].getAttribute('src'))) resetCat(k);
        if (want && !c.active) {
          c.active = true;
          if (c.cur < 0) startFirst(k);
          else c.els.forEach((e, i) => { if (i === c.cur || (c.xf && i === c.xf.to)) e.play().catch(() => { }); });
        } else if (!want && c.active) { c.active = false; c.els.forEach(e => e.pause()); }
        applyVol(k);
        if (c.row) c.row.classList.toggle('live', want);
      });
    }
    // crossfade engine: runs every 100ms while playing
    setInterval(() => {
      if (!playing) return;
      const now = performance.now();
      for (const k in runtime) {
        const c = runtime[k]; if (!c.active || c.cur < 0) continue;
        if (c.xf) {
          const x = c.xf, p = Math.min(1, (now - x.t0) / (x.len * 1000));
          if (x.bad) { freeEl(c.els[x.to]); c.g[x.to] = 0; c.g[x.from] = 1; c.xf = null; c.next = null; planNext(k); applyVol(k); continue; }
          c.g[x.from] = Math.cos(p * Math.PI / 2); c.g[x.to] = Math.sin(p * Math.PI / 2);
          if (p >= 1) { freeEl(c.els[x.from]); c.g[x.from] = 0; c.g[x.to] = 1; c.cur = x.to; c.xf = null; planNext(k); }
          applyVol(k); continue;
        }
        const cur = c.els[c.cur], d = cur.duration;
        if (!isFinite(d) || d <= 0 || !c.next) continue;
        const xl = Math.min(XF, d / 3), left = d - cur.currentTime, idle = 1 - c.cur, ie = c.els[idle];
        if (left <= xl + 4 && !ie.getAttribute('src')) ie.src = c.next.url;              // start buffering the next file
        if (left <= xl && ie.getAttribute('src')) {                                        // start crossfade
          c.g[idle] = 0; ie.play().catch(() => { });
          c.xf = { from: c.cur, to: idle, t0: now, len: xl }; c.n = c.next.n; c.next = null;
        }
      }
    }, 100);

    function setPlay(p) {
      clearInterval(fadeTimer); playing = p; fade = p ? 0 : 1;      // every play starts from silence and rises smoothly
      $('play').innerHTML = '<i class="fa-solid fa-' + (p ? 'pause' : 'play') + '"></i>';
      $('play').classList.toggle('on', p);
      $('play').setAttribute('aria-label', p ? 'Pause' : 'Play');
      if (p) boot();
      sync();
      if (p) fadeTimer = setInterval(() => { fade = Math.min(1, fade + RAMP); sync(); if (fade >= 1) clearInterval(fadeTimer); }, 100);
    }
    $('play').onclick = () => setPlay(!playing);
    $('mv').value = master; fill($('mv'));
    $('mv').oninput = e => { master = +e.target.value; fill(e.target); save(); sync(); };

    /* ---------- sound list ---------- */
    function paintInfo(k) {
      const c = runtime[k]; if (!c || !c.row) return;
      c.row.querySelector('.err').textContent = (c.ready && !c.first) ? 'No files in sounds/' + k + '/' : '';
    }
    function render() {
      const l = $('list'); l.innerHTML = '';
      sel.forEach(k => {
        ensure(k);
        const C = CATS[k], row = document.createElement('div'); row.className = 'row';
        row.innerHTML = '<i class="fa-solid fa-' + C.icon + ' ic"></i><div class="nm">' + C.name + '<small class="err"></small></div>' +
          '<input type="range" min="0" max="1" step=".01" aria-label="' + C.name + ' volume">' +
          '<button class="rm" aria-label="Remove ' + C.name + '"><i class="fa-solid fa-xmark"></i></button>';
        const r = row.querySelector('input'); r.value = vOf(k); fill(r);
        r.oninput = () => { vol[k] = +r.value; fill(r); save(); sync(); };
        row.querySelector('.rm').onclick = () => { sel = sel.filter(x => x !== k); save(); render(); };
        runtime[k].row = row; paintInfo(k); l.appendChild(row);
      });
      const rest = Object.keys(CATS).filter(k => !sel.includes(k)), m = $('more'); m.innerHTML = '';
      rest.forEach(k => {
        const C = CATS[k], b = document.createElement('button'); b.className = 'opt';
        b.innerHTML = '<i class="fa-solid fa-' + C.icon + '"></i>' + C.name + '<span>Add</span>';
        b.onclick = () => { sel.push(k); save(); render(); };
        m.appendChild(b);
      });
      $('addbtn').hidden = !rest.length;
      if (!rest.length) m.hidden = true;
      sync();
    }
    $('addbtn').onclick = () => {
      const m = $('more'); m.hidden = !m.hidden; $('addbtn').setAttribute('aria-expanded', String(!m.hidden));
    };
    render();

    /* ---------- timer ---------- */
    let endAt = 0, tick;
    [15, 30, 60, 120].forEach(m => {
      const b = document.createElement('button'); b.textContent = m; b.dataset.m = m; b.setAttribute('aria-label', m + ' minutes');
      b.onclick = () => setTimer(+b.dataset.m); $('topts').appendChild(b);
    });
    const off = document.createElement('button'); off.textContent = 'Off'; off.dataset.m = 0; off.onclick = () => setTimer(0); $('topts').appendChild(off);
    function setTimer(m) {
      clearInterval(tick); endAt = 0; $('tclock').textContent = '';
      [...$('topts').children].forEach(b => b.classList.toggle('sel', +b.dataset.m === m && m > 0));
      if (!m) return;
      if (!playing) setPlay(true);
      endAt = Date.now() + m * 60000;
      const show = () => {
        const r = endAt - Date.now(); if (r <= 0) return false;
        const s = Math.ceil(r / 1000), h = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60), ss = s % 60, p = n => String(n).padStart(2, '0');
        $('tclock').textContent = (h ? h + ':' : '') + p(mm) + ':' + p(ss); return true;
      };
      show();
      tick = setInterval(() => { if (!show()) { clearInterval(tick); fadeOut(); } }, 500);
    }
    function fadeOut() {
      $('tclock').textContent = 'Fading out…';
      clearInterval(fadeTimer);
      fadeTimer = setInterval(() => {
        fade = Math.max(0, fade - .05); sync();
        if (fade <= 0) { setPlay(false); setTimer(0); }
      }, 300);
    }
    $('cset').onclick = () => {
      const m = parseInt($('cm').value, 10);
      if (m > 0 && m <= 720) setTimer(m);
    };

    /* ---------- ripples on dark water (lightweight on phones) ---------- */
    (function () {
      const cv = $('pond'), g = cv.getContext('2d');
      const still = matchMedia('(prefers-reduced-motion:reduce)').matches;
      const small = matchMedia('(max-width:820px)').matches || matchMedia('(pointer:coarse)').matches;
      const MAXR = small ? 20 : 45, STEP = 1000 / (small ? 30 : 60) - 2, RINGS = small ? 2 : 3, K = small ? .55 : 1;
      let W, H, S, rip = [], acc = 0, last = performance.now(), lastDraw = 0;
      const rnd = (a, b) => a + Math.random() * (b - a);
      function size() { S = small ? 1 : Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * S; H = cv.height = innerHeight * S; }
      function spawn(t) {
        if (rip.length >= MAXR) return;
        const y = H * rnd(.32, 1), depth = y / H;
        rip.push({ x: rnd(0, W), y, t0: t, dur: rnd(1700, 2900), max: (30 + 130 * depth) * S * rnd(.55, 1.1), a: .18 + .32 * depth });
      }
      function frame(t) {
        if (!still) requestAnimationFrame(frame);
        if (t - lastDraw < STEP) return;
        lastDraw = t;
        const dt = Math.min(.1, (t - last) / 1000); last = t;
        const rain = playing && sel.includes('rain');
        const rate = (playing ? (rain ? 1.5 + 13 * vOf('rain') * master * fade : 1.2 * master * fade) : .22) * K;
        acc += rate * dt; while (acc >= 1) { acc -= 1; spawn(t); }
        g.clearRect(0, 0, W, H); g.lineWidth = Math.max(1, S * .9);
        rip = rip.filter(r => t - r.t0 < r.dur);
        rip.forEach(r => {
          const age = (t - r.t0) / r.dur;
          if (age < .1) { g.fillStyle = `rgba(190,240,248,${.5 * (1 - age / .1)})`; g.beginPath(); g.ellipse(r.x, r.y, 2.2 * S, .9 * S, 0, 0, 7); g.fill(); }
          for (let i = 0; i < RINGS; i++) {
            const a2 = age - i * .1; if (a2 <= 0 || a2 >= 1) continue;
            const e = 1 - Math.pow(1 - a2, 2.2), rx = r.max * (1 - i * .27) * e;
            g.strokeStyle = `rgba(165,232,242,${r.a * Math.pow(1 - a2, 1.8) * (1 - i * .3)})`;
            g.beginPath(); g.ellipse(r.x, r.y, rx, rx * .34, 0, 0, 7); g.stroke();
          }
        });
      }
      addEventListener('resize', size); size();
      document.addEventListener('visibilitychange', () => { last = performance.now(); });
      if (still) { for (let i = 0; i < 8; i++) { spawn(performance.now() - 600); } frame(performance.now()); }
      else requestAnimationFrame(frame);
    })();
  </script>
</body>
